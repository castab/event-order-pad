name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Check, lint, test, build and e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:printer
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
